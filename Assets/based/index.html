<link rel="stylesheet" href="app.css">
<div id="shade" class="shade"><div class="board">
  <img class="layer-board" src="board.png">
  <img class="layer-sheets" src="sheets-under.png">
  <div class="paper">
    <img class="layer-paper" src="paper.png">
    <div id="title" class="title"></div>
    <div class="rule"></div>
    <div class="content">
      <div id="drawing" class="drawing"></div>
      <div class="side">
        <button id="back" class="back"></button>
        <div id="menu" class="menu">
          <div id="hint" class="hint"></div>
          <div id="builds" class="builds"></div>
        </div>
        <div id="report" class="report">
          <div id="status" class="status"></div>
          <div id="progress" class="progress"></div>
        </div>
        <div id="costs" class="costs">
          <div id="rights-row" class="cost"><div id="rights-label"></div><div id="rights"></div></div>
          <div id="construction-row" class="cost"><div id="construction-label"></div><div id="construction"></div></div>
          <div class="cost total"><div id="duration"></div><div id="cash"></div></div>
        </div>
        <div id="steps" class="steps"></div>
        <div id="notes" class="notes"></div>
        <div id="notice" class="notice"></div>
        <div id="payment" class="note"></div>
        <div class="space"></div>
        <button id="take" class="take"></button>
        <button id="buy" class="buy"></button>
      </div>
    </div>
    <button id="close" class="close">X</button>
  </div>
  <img class="layer-tape" src="tape.png">
  <img class="layer-pencil" src="pencil.png">
  <img class="layer-clip" src="clip.png">
</div></div>
<script src="app.js"></script>
